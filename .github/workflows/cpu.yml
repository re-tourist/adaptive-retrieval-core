name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.10"
      - run: uv python install 3.12
      - run: uv sync --locked --group sparse --group harness --group harness-test
      - run: uv run --no-sync python -c "import arc"
      - run: uv run --no-sync pytest
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker version
      - run: docker build --tag arc:v0 .
      - name: Start image and verify search over HTTP
        run: |
          docker image inspect arc:v0 --format '{{.Id}} {{.Size}}'
          docker run -d --name arc-smoke -p 127.0.0.1:8080:8000 arc:v0
          trap 'docker logs arc-smoke || true; docker logs arc-catalog || true; docker rm -f arc-smoke arc-catalog' EXIT
          docker run -d --name arc-catalog -e ARC_DATASET=catalog -p 127.0.0.1:8081:8000 arc:v0
          python3 scripts/container-smoke.py http://127.0.0.1:8080
          python3 scripts/container-smoke.py http://127.0.0.1:8081 --catalog
