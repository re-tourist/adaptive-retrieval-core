<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Search Playground · Adaptive Retrieval Core</title>
  <link rel="stylesheet" href="playground.css">
  <script src="playground.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="wrap bar">
      <a class="brand" href="./" aria-label="ARC Search Playground home">
        <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 18a8 8 0 0 1 16 0M8 18a4 4 0 0 1 8 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
        <strong>ARC</strong><span class="brand-label">Search Playground</span>
      </a>
      <div class="bar-right"><span id="corpus" class="badge" hidden></span><a href="../docs">API reference <span aria-hidden="true">↗</span></a></div>
    </div>
  </header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <div class="wrap intro-inner">
        <p class="kicker"><span aria-hidden="true"></span> <span id="vertical">SEARCH PLAYGROUND</span></p>
        <h1 id="page-title">Find the right match.</h1>
        <p id="lead" class="lead">Search the active ARC corpus in your own words.</p>
        <form id="search-form" class="searchbox" role="search">
          <label for="query" class="sr-only">Search the corpus</label>
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><circle cx="10.8" cy="10.8" r="5.8"/><path d="m15.2 15.2 4.2 4.2"/></svg>
          <input id="query" type="search" placeholder="Describe what you’re looking for" required maxlength="4096" autocomplete="off" disabled>
          <button id="submit" type="submit" disabled>Search</button>
        </form>
        <div id="examples" class="examples" aria-label="Example searches" hidden><span>Try</span></div>
      </div>
    </section>
    <section class="wrap results" aria-labelledby="results-title">
      <div class="result-bar">
        <div>
          <h2 id="results-title">Search results</h2>
          <p class="result-meta" id="status" role="status">Connecting to ARC…</p>
        </div>
        <div class="view-switch" role="group" aria-label="Result view">
          <button id="search-view" type="button" aria-pressed="true" disabled>Search</button>
          <button id="compare-view" type="button" aria-pressed="false" disabled>Compare</button>
        </div>
      </div>
      <div id="strategies" class="strategy-row" hidden>
        <label>Strategy <select id="primary"></select></label>
        <label id="second-control" hidden>Compare with <select id="secondary"></select></label>
      </div>
      <div id="catalog" aria-busy="false"></div>
      <details id="diagnostics" class="diagnostics" hidden>
        <summary>Retrieval details</summary>
        <div id="trace"></div>
      </details>
      <footer class="notice">
        <span id="provenance"></span>
        <span id="availability" hidden>Compare requires a second strategy. Configure a BGE model and a compatible index to enable Dense and Hybrid.</span>
      </footer>
    </section>
  </main>
</body>
</html>
