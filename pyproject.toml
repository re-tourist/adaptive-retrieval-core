[build-system]
requires = ["uv_build>=0.9.10,<0.10"]
build-backend = "uv_build"

[project]
name = "adaptive-retrieval-core"
version = "0.1.0"
description = "Benchmark-driven modular retrieval core"
readme = "README.md"
requires-python = ">=3.12,<3.13"

[project.scripts]
arc = "arc.entrypoints.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.15.21,<0.16"]
harness = ["fastapi==0.135.1", "uvicorn==0.42.0"]
harness-test = ["httpx>=0.28,<0.29"]
sparse = ["bm25s>=0.2.10,<0.3", "numpy>=2,<3"]
dense = [
    "faiss-cpu>=1.10,<2",
    "numpy>=2,<3",
    "sentence-transformers>=5.1,<6",
    "torch==2.8.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }

[tool.uv.build-backend]
module-name = "arc"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
