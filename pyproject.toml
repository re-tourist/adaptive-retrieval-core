[build-system]
requires = ["uv_build>=0.9.10,<0.10"]
build-backend = "uv_build"

[project]
name = "adaptive-retrieval-core"
version = "0.1.0"
description = "Benchmark-driven modular retrieval core"
readme = "README.md"
requires-python = ">=3.12,<3.13"

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.15.21,<0.16"]

[tool.uv.build-backend]
module-name = "arc"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
